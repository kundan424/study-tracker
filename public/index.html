<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logbook — Study Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <h1 class="hero-title">Logbook</h1>
      <div class="hero-sub" id="heroSub">loading —</div>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <button id="themeToggle" style="background:transparent; border:1px solid var(--line); color:var(--paper); font-size:18px; padding:6px 10px; cursor:pointer; border-radius: 4px;" title="Toggle Theme">
        🌓
      </button>
      <div class="streak-badge">
        <div>
          <div class="streak-num" id="streakNum">0</div>
          <div class="streak-label">DAY STREAK</div>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="lectures">Lectures</button>
    <button data-tab="sessions">Sessions</button>
    <button data-tab="subjects">Subjects</button>
    <button data-tab="tasks">Tasks</button>
    <button data-tab="calendar">Calendar</button>
  </nav>

  <main id="app">
    <div class="empty-note">Loading your logbook…</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- JS files loaded in order -->
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/components/dashboard.js"></script>
<script src="js/components/lectures.js"></script>
<script src="js/components/sessions.js"></script>
<script src="js/components/subjects.js"></script>
<script src="js/components/tasks.js"></script>
<script src="js/components/calendar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
